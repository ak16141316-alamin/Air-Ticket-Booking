<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh Airlines | Book Your Flight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: url('https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glassmorphism Effect */
        .booking-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            color: white;
        }

        h2 { text-align: center; margin-bottom: 30px; font-size: 32px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .trip-type { display: flex; gap: 20px; margin-bottom: 25px; }
        .trip-type label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: #f1f1f1; }

        select, input {
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        select:focus, input:focus { box-shadow: 0 0 0 4px rgba(37, 117, 252, 0.4); }

        .btn-search {
            grid-column: 1 / -1;
            margin-top: 20px;
            padding: 15px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-search:hover { background: #ff3333; transform: scale(1.02); }

        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="booking-card">
    <h2>Book Your Dream Flight</h2>
    
    <div class="trip-type">
        <label><input type="radio" name="trip" checked> Round Trip</label>
        <label><input type="radio" name="trip"> One Way</label>
        <label><input type="radio" name="trip"> Multi City</label>
    </div>

    <form action="#" class="input-grid">
        <div class="input-group">
            <label>Flying From</label>
            <select>
                <option disabled selected>Select Origin</option>
                <option>Dhaka (DAC)</option>
                <option>Chittagong (CGP)</option>
                <option>London (LHR)</option>
                <option>Dubai (DXB)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Flying To</label>
            <select>
                <option disabled selected>Select Destination</option>
                <option>New York (JFK)</option>
                <option>Singapore (SIN)</option>
                <option>Bangkok (BKK)</option>
                <option>Sydney (SYD)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Departure Date</label>
            <input type="date">
        </div>

        <div class="input-group">
            <label>Travelers & Class</label>
            <select>
                <option>1 Traveler, Economy</option>
                <option>2 Travelers, Business</option>
                <option>1 Traveler, First Class</option>
            </select>
        </div>

        <button type="button" class="btn-search" onclick="alert('Searching for available flights...')">Search Flights</button>
    </form>
</div>

</body>
                  </html>
